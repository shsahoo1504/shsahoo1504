apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: buildin10
  labels:
    app: payments-api
    app.kubernetes.io/name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        app.kubernetes.io/name: payments-api
    spec:
      containers:
        - name: payments-api
          image: ghcr.io/YOUR_GITHUB_ORG/payments-api:latest
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
