apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: buildin10-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/YOUR_GITHUB_ORG/gitops.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: buildin10-{{path.basename}}
    spec:
      project: buildin10
      source:
        repoURL: https://github.com/YOUR_GITHUB_ORG/gitops.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: buildin10
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
