apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: buildin10
  namespace: argocd
spec:
  description: Buildin10 demo applications
  sourceRepos:
    - https://github.com/YOUR_GITHUB_ORG/gitops.git
  destinations:
    - namespace: buildin10
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
