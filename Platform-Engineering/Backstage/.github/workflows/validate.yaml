name: Validate repository
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static repository checks
        run: ./scripts/validate-local.sh
      - name: Sample service syntax
        run: |
          node --check services/payments-api/src/server.js
          node --check services/orders-api/src/server.js
